[policy]
phase = "m5"
active_milestone = "m5"
quality_harness = "quality-harness"
non_production_test_crates = ["intention-test-support"]
active_production_crates = [
  "intention-proto",
  "intention-domain",
  "intention-protocol",
  "intention-config",
  "intention-transport",
  "intention-client",
  "intention",
  "intention-daemon",
  "intention-application",
  "intention-runtime",
  "intention-storage",
  "intention-storage-sqlite",
  "intention-model",
  "intention-provider-openrouter",
  "intention-provider-generic-chat",
  "intention-tools",
  "intention-workspace",
  "intention-hooks",
]
skeleton_crates = [
  "intention-headroom",
  "intention-plans",
  "intention-vfr",
]

[non_production_test_dependencies]
"intention-test-support" = [
  "intention",
  "intention-config",
  "intention-daemon",
  "intention-domain",
  "intention-protocol",
  "intention-transport",
  "intention-proto",
]

[non_production_test_external_dependencies]
"intention-test-support" = ["serde_json", "tempfile", "tokio"]

[forbidden]
source_patterns = [
  "std::env::current_dir",
  "std::process::exit",
  "serde_json::Value",
  "rusqlite::",
  "tauri::",
]
test_only_source_patterns = [
  "std::env::current_dir",
  "std::env::set_current_dir",
]

[dependencies]
"intention-proto" = []
"intention-domain" = ["intention-proto"]
"intention-config" = ["intention-proto"]
"intention-protocol" = ["intention-proto", "intention-domain"]
"intention-storage" = ["intention-config", "intention-domain", "intention-proto"]
"intention-transport" = ["intention-protocol", "intention-proto"]
"intention-client" = ["intention-domain", "intention-protocol", "intention-transport", "intention-proto"]
"intention" = ["intention-application", "intention-config", "intention-domain", "intention-hooks", "intention-model", "intention-protocol", "intention-provider-generic-chat", "intention-provider-openrouter", "intention-runtime", "intention-storage", "intention-storage-sqlite", "intention-tools", "intention-proto", "intention-workspace"]
"intention-daemon" = ["intention", "intention-application", "intention-client", "intention-config", "intention-domain", "intention-model", "intention-protocol", "intention-runtime", "intention-tools", "intention-transport", "intention-proto"]
"intention-application" = ["intention-config", "intention-domain", "intention-hooks", "intention-protocol", "intention-runtime", "intention-storage", "intention-tools", "intention-proto", "intention-workspace"]
"intention-runtime" = ["intention-config", "intention-domain", "intention-model", "intention-storage", "intention-proto"]
"intention-storage-sqlite" = ["intention-config", "intention-domain", "intention-storage", "intention-proto"]
"intention-model" = ["intention-proto"]
"intention-provider-openrouter" = ["intention-config", "intention-model", "intention-proto"]
"intention-provider-generic-chat" = ["intention-config", "intention-model", "intention-proto"]
"intention-tools" = ["intention-domain", "intention-proto", "intention-workspace"]
"intention-workspace" = ["intention-domain", "intention-proto"]
"intention-hooks" = ["intention-tools", "intention-proto"]

[external_dependencies]
"intention-proto" = ["serde", "serde_json", "uuid"]
"intention-domain" = ["serde", "serde_json"]
"intention-config" = ["serde", "serde_json", "toml"]
"intention-protocol" = ["serde", "serde_json"]
"intention-transport" = ["interprocess", "serde", "serde_json", "tempfile", "tokio"]
"intention-client" = ["fs4", "tempfile", "tokio"]
"intention" = ["futures-util", "tempfile"]
"intention-daemon" = ["futures-util", "serde_json", "tempfile", "tokio"]
"intention-application" = []
"intention-runtime" = ["futures-executor", "futures-util"]
"intention-storage" = ["serde_json"]
"intention-storage-sqlite" = ["rusqlite", "serde_json", "tempfile"]
"intention-model" = ["futures-core", "futures-executor", "futures-util", "serde", "serde_json"]
"intention-provider-openrouter" = ["futures-util", "http", "openrouter-rs", "serde_json"]
"intention-provider-generic-chat" = ["async-openai", "futures-util", "http", "serde", "serde_json"]
"intention-tools" = ["glob", "rustix", "serde", "serde_json", "tempfile"]
"intention-workspace" = []
"intention-hooks" = []

[adapter_boundaries]
packages = ["intention-tauri", "intention-tui"]
allowed_workspace_dependencies = ["intention-client", "intention-protocol", "intention-transport", "intention-proto"]
allowed_test_workspace_dependencies = ["intention-daemon", "intention-domain", "intention-test-support"]
allowed_external_dependencies = ["serde_json", "tokio"]
forbidden_source_patterns = [
  "intention_application::",
  "intention_runtime::",
  "intention_storage::",
  "intention_storage_sqlite::",
  "intention_tools::",
  "intention_provider_",
  "rusqlite::",
  "tauri::",
]

[protocol_boundary]
package = "intention-protocol"
allowed_workspace_dependencies = ["intention-proto", "intention-domain"]
allowed_external_dependencies = ["serde", "serde_json"]
forbidden_source_patterns = [
  "tauri::",
  "rusqlite::",
  "intention_tauri::",
  "intention_tui::",
  "intention_provider_",
  "async_openai::",
  "openrouter_sdk::",
]

[composition]
root_package = "intention"
concrete_implementation_crates = [
  "intention-storage-sqlite",
  "intention-provider-openrouter",
  "intention-provider-generic-chat",
  "intention-vfr",
  "intention-headroom",
  "intention-plans",
]
owned_selection_patterns = [
  "SqliteStorageRepository",
  "OpenRouterDriver",
  "GenericChatDriver",
]

[public_contracts]
# Provider SDK namespaces are restricted to their owner crate's private
# implementation by the source-level architecture checker.
provider_sdk_resource_patterns = [
  "async_openai::",
  "openrouter_rs::",
  "openrouter_sdk::",
  "reqwest::",
]

[ordering_authorities]
# The closed set of durable ordering-authority type names. Every record family
# orders by SQLite row insertion order, so the declared set is empty: no
# production type may name itself a durable ordering authority, and the suffix
# guard rejects a reintroduced sequence, cursor, position, ticket, watermark,
# order, epoch, or journal family.
declared = []
name_suffixes = [
  "SequenceDto",
  "CursorDto",
  "PositionDto",
  "TicketDto",
  "WatermarkDto",
  "OrderDto",
  "EpochDto",
  "JournalDto",
]

[[future_crates]]
name = "intention-proto"
test_targets = ["contracts", "error_contracts", "m4_model_values"]

[[future_crates]]
name = "intention-domain"
test_targets = ["contracts", "m3_contracts", "m5_tool_results"]

# Active M3 application lifecycle targets are checked against Cargo metadata.
[[future_crates]]
name = "intention-application"
test_targets = ["m3_application"]

[[future_crates]]
name = "intention-runtime"
test_targets = ["m3_runtime", "m4_model_execution", "m4_runtime_failure_helpers", "m5_tool_loop"]

[[future_crates]]
