[policy]
phase = "slice15"
active_milestone = "slice15"
quality_harness = "quality-harness"
non_production_test_crates = ["intention-test-support"]
active_production_crates = [
  "intention-proto",
  "intention-domain",
  "intention-config",
  "intention-transport",
  "intention-client",
  "intention-daemon",
  "intention-engine",
  "intention-storage",
  "intention-providers",
  "intention-tools",
]
skeleton_crates = [
  "intention-headroom",
  "intention-plans",
  "intention-vfr",
]

[non_production_test_dependencies]
"intention-test-support" = [
  "intention-config",
  "intention-daemon",
  "intention-providers",
  "intention-proto",
  "intention-transport",
]

[non_production_test_external_dependencies]
"intention-test-support" = ["futures-executor", "futures-util", "serde_json", "tempfile", "tokio"]

[forbidden]
source_patterns = [
  "std::env::current_dir",
  "std::process::exit",
  "serde_json::Value",
  "rusqlite::",
  "tauri::",
]
test_only_source_patterns = [
  "std::env::current_dir",
  "std::env::set_current_dir",
]

[dependencies]
"intention-proto" = []
"intention-domain" = ["intention-proto"]
"intention-config" = ["intention-proto"]
"intention-storage" = ["intention-config", "intention-domain", "intention-proto"]
"intention-transport" = ["intention-proto"]
"intention-client" = ["intention-transport", "intention-proto"]
"intention-daemon" = ["intention-client", "intention-config", "intention-domain", "intention-engine", "intention-proto", "intention-providers", "intention-storage", "intention-tools", "intention-transport"]
"intention-engine" = ["intention-config", "intention-domain", "intention-providers", "intention-proto", "intention-storage", "intention-test-support", "intention-tools"]
"intention-providers" = ["intention-config", "intention-proto"]
"intention-tools" = ["intention-proto"]

[external_dependencies]
"intention-proto" = ["serde", "serde_json", "uuid"]
"intention-domain" = ["serde", "serde_json"]
"intention-config" = ["serde", "serde_json", "toml"]
"intention-transport" = ["interprocess", "serde", "serde_json", "tempfile", "tokio"]
"intention-client" = ["fs4", "tokio"]
"intention-daemon" = ["futures-util", "serde_json", "tempfile", "tokio"]
"intention-engine" = ["futures-util"]
"intention-storage" = ["rusqlite", "serde_json", "tempfile"]
"intention-providers" = ["async-openai", "futures-core", "futures-executor", "futures-util", "http", "openrouter-rs", "serde", "serde_json"]
"intention-tools" = ["glob", "rustix", "serde", "serde_json", "tempfile"]

[adapter_boundaries]
packages = ["intention-tauri", "intention-tui"]
allowed_workspace_dependencies = ["intention-client", "intention-transport", "intention-proto"]
allowed_test_workspace_dependencies = ["intention-daemon", "intention-test-support"]
allowed_external_dependencies = ["serde_json", "tokio"]
forbidden_source_patterns = [
  "intention_engine::",
  "intention_storage::",
  "intention_tools::",
  "intention_providers::",
  "rusqlite::",
  "tauri::",
]

[protocol_boundary]
package = "intention-proto"
allowed_workspace_dependencies = []
allowed_external_dependencies = ["serde", "serde_json", "uuid"]
forbidden_source_patterns = [
  "tauri::",
  "rusqlite::",
  "intention_tauri::",
  "intention_tui::",
  "intention_provider_",
  "async_openai::",
  "openrouter_sdk::",
]

[composition]
root_package = "intention-daemon"
concrete_implementation_crates = [
  "intention-vfr",
  "intention-headroom",
  "intention-plans",
]
owned_selection_patterns = [
  "SelectedProvider",
]

[composition.owned_type_names]
# Concrete implementation types may be named only inside their defining crate and
# the declared composition root.
"SqliteStorageRepository" = "intention-storage"
"SqliteDatabaseLocationDto" = "intention-storage"
"OpenRouterDriver" = "intention-providers"
"GenericChatDriver" = "intention-providers"

[public_contracts]
# Provider SDK namespaces are restricted to their owner crate's private
# implementation by the source-level architecture checker.
provider_sdk_resource_patterns = [
  "async_openai::",
  "openrouter_rs::",
  "openrouter_sdk::",
  "reqwest::",
]

[ordering_authorities]
# The closed set of durable ordering-authority type names. Every record family
# orders by SQLite row insertion order, so the declared set is empty: no
# production type may name itself a durable ordering authority, and the suffix
# guard rejects a reintroduced sequence, cursor, position, ticket, watermark,
# order, epoch, or journal family.
declared = []
name_suffixes = [
  "SequenceDto",
  "CursorDto",
  "PositionDto",
  "TicketDto",
  "WatermarkDto",
  "OrderDto",
  "EpochDto",
  "JournalDto",
]

[[future_crates]]
name = "intention-proto"
test_targets = ["contracts", "error_contracts", "m3_contracts", "m4_model_values", "protocol_contracts"]

[[future_crates]]
name = "intention-domain"
test_targets = ["contracts", "m3_contracts", "m5_tool_results"]

# Active M3 application lifecycle targets are checked against Cargo metadata.
[[future_crates]]
name = "intention-engine"
test_targets = ["m3_engine", "m3_runtime", "m4_model_execution", "m4_runtime_failure_helpers", "m5_tool_loop"]

[[future_crates]]
name = "intention-storage"
test_targets = ["contracts", "m4_model_context", "m4_run_safe_config", "opaque_json_guard", "sqlite_contracts"]

[[future_crates]]
name = "intention-config"
test_targets = ["contracts", "snapshot_fixtures", "m4_contracts"]

[[future_crates]]
name = "intention-providers"
test_targets = ["generic_chat_contracts", "m4_execution_contracts", "model_contracts", "openrouter_contracts"]

[[future_crates]]
name = "intention-tools"
test_targets = ["bounded_contracts", "hook_contracts", "tool_contracts", "tool_coverage", "workspace_contract"]

[[future_crates]]
name = "intention-vfr"
test_targets = []

[[future_crates]]
name = "intention-headroom"
test_targets = []

[[future_crates]]
name = "intention-plans"
test_targets = []

[[future_crates]]
name = "intention-transport"
test_targets = ["transport_integration"]

[[future_crates]]
name = "intention-client"
test_targets = ["client_contract", "run_stream_contract"]

[[future_crates]]
name = "intention-test-support"
test_targets = ["composition_contract", "fixture_host"]

[[future_crates]]
name = "intention-daemon"
test_targets = ["client_e2e", "daemon_bootstrap", "m4_streaming_foundation", "m5_tool_loop_wiring", "real_api_e2e"]

[[future_crates]]
name = "intention-tauri"
test_targets = []

[[future_crates]]
name = "intention-tui"
test_targets = ["tui_contract"]
