[policy]
phase = "m5"
active_milestone = "m5"
quality_harness = "quality-harness"
non_production_test_crates = ["intention-test-support"]
active_production_crates = [
  "intention-types",
  "intention-domain",
  "intention-protocol",
  "intention-config",
  "intention-transport",
  "intention-client",
  "intention",
  "intention-daemon",
  "intention-application",
  "intention-runtime",
  "intention-storage",
  "intention-storage-sqlite",
  "intention-model",
  "intention-provider-openrouter",
  "intention-provider-generic-chat",
  "intention-tools",
  "intention-workspace",
  "intention-hooks",
]
skeleton_crates = [
  "intention-vfr",
  "intention-headroom",
  "intention-plans",
  "intention-tauri",
]

[non_production_test_dependencies]
"intention-test-support" = [
  "intention",
  "intention-config",
  "intention-daemon",
  "intention-domain",
  "intention-protocol",
  "intention-transport",
  "intention-types",
]

[non_production_test_external_dependencies]
"intention-test-support" = ["serde_json", "tempfile"]

[forbidden]
source_patterns = [
  "std::env::current_dir",
  "std::process::exit",
  "serde_json::Value",
  "rusqlite::",
  "tauri::",
]
test_only_source_patterns = [
  "std::env::current_dir",
  "std::env::set_current_dir",
]
reason_required_attributes = ["allow", "expect"]
secret_assignment_patterns = ["api_key", "api-key", "secret", "token", "password"]
public_resource_patterns = [
  "std::fs::File",
  "std::path::PathBuf",
  "std::process::Command",
  "tokio::",
  "interprocess::",
  "rusqlite::",
  "tauri::",
  "serde_json::Value",
]

[dependencies]
"intention-types" = []
"intention-domain" = ["intention-types"]
"intention-config" = ["intention-types"]
"intention-protocol" = ["intention-types", "intention-domain"]
"intention-storage" = ["intention-config", "intention-domain", "intention-types"]
"intention-transport" = ["intention-protocol", "intention-types"]
"intention-client" = ["intention-domain", "intention-protocol", "intention-transport", "intention-types"]
"intention" = ["intention-application", "intention-client", "intention-config", "intention-domain", "intention-model", "intention-protocol", "intention-provider-generic-chat", "intention-provider-openrouter", "intention-runtime", "intention-storage", "intention-storage-sqlite", "intention-tools", "intention-types", "intention-workspace"]
"intention-daemon" = ["intention", "intention-application", "intention-client", "intention-config", "intention-domain", "intention-model", "intention-protocol", "intention-runtime", "intention-transport", "intention-types"]
"intention-application" = ["intention-config", "intention-domain", "intention-hooks", "intention-protocol", "intention-runtime", "intention-storage", "intention-tools", "intention-types", "intention-workspace"]
"intention-runtime" = ["intention-config", "intention-domain", "intention-model", "intention-storage", "intention-types"]
"intention-storage-sqlite" = ["intention-config", "intention-domain", "intention-storage", "intention-types"]
"intention-model" = ["intention-types"]
"intention-provider-openrouter" = ["intention-config", "intention-model", "intention-types"]
"intention-provider-generic-chat" = ["intention-config", "intention-model", "intention-types"]
"intention-tools" = ["intention-domain", "intention-types", "intention-workspace"]
"intention-workspace" = ["intention-domain", "intention-types"]
"intention-hooks" = ["intention-tools", "intention-types"]

[future_dependencies]
"intention-runtime" = ["intention-model"]

[external_dependencies]
"intention-types" = ["serde", "serde_json", "uuid"]
"intention-domain" = ["serde", "serde_json"]
"intention-config" = ["serde", "serde_json", "toml"]
"intention-protocol" = ["serde", "serde_json"]
"intention-transport" = ["interprocess", "serde", "serde_json", "tempfile", "tokio"]
"intention-client" = ["fs4", "tempfile", "tokio"]
"intention" = ["futures-util", "tempfile"]
"intention-daemon" = ["futures-util", "serde_json", "tempfile", "tokio"]
"intention-application" = []
"intention-runtime" = ["futures-executor", "futures-util"]
"intention-storage" = ["serde_json"]
"intention-storage-sqlite" = ["rusqlite", "rusqlite_migration", "serde_json", "tempfile"]
"intention-model" = ["futures-core", "futures-executor", "futures-util", "serde", "serde_json"]
"intention-provider-openrouter" = ["futures-util", "http", "openrouter-rs", "serde_json"]
"intention-provider-generic-chat" = ["async-openai", "futures-util", "serde_json"]
"intention-tools" = ["glob", "serde", "serde_json", "tempfile"]
"intention-workspace" = []
"intention-hooks" = []

[adapter_boundaries]
packages = ["intention-tauri", "intention-tui"]
allowed_workspace_dependencies = ["intention-client", "intention-protocol", "intention-transport", "intention-types"]
allowed_test_workspace_dependencies = ["intention-daemon", "intention-domain", "intention-test-support"]
allowed_external_dependencies = []
forbidden_source_patterns = [
  "intention_application::",
  "intention_runtime::",
  "intention_storage::",
  "intention_storage_sqlite::",
  "intention_tools::",
  "intention_provider_",
  "rusqlite::",
  "tauri::",
]

[protocol_boundary]
package = "intention-protocol"
allowed_workspace_dependencies = ["intention-types", "intention-domain"]
allowed_external_dependencies = ["serde", "serde_json"]
forbidden_source_patterns = [
  "tauri::",
  "rusqlite::",
  "intention_tauri::",
  "intention_tui::",
  "intention_provider_",
  "async_openai::",
  "openrouter_sdk::",
]

[composition]
root_package = "intention"
concrete_implementation_crates = [
  "intention-storage-sqlite",
  "intention-provider-openrouter",
  "intention-provider-generic-chat",
  "intention-vfr",
  "intention-headroom",
  "intention-plans",
]

[public_contracts]
forbidden_type_prefixes = [
  "std::fs::",
  "std::path::",
  "std::process::",
  "tokio::",
  "interprocess::",
  "rusqlite::",
  "tauri::",
  "serde_json::Value",
  "async_openai::",
  "openrouter_rs::",
  "openrouter_sdk::",
  "openrouter::",
  "reqwest::",
]
provider_sdk_resource_patterns = [
  "async_openai::",
  "openrouter_rs::",
  "openrouter_sdk::",
  "reqwest::",
]

[[future_crates]]
name = "intention-types"
responsibility = "Identifiers, schema versions, common errors, time, pagination, and envelopes."
test_target = "dto and validation tests"
test_targets = ["contracts", "error_contracts", "m3_contracts", "m4_model_values"]
coverage_tier = "A"

[[future_crates]]
name = "intention-domain"
responsibility = "Domain DTOs, value validation, domain events, and invariants."
test_target = "domain state and invariant tests"
test_targets = ["contracts", "event_fixtures", "m3_contracts", "m4_durable_facts", "m4_durable_fact_wires"]
coverage_tier = "A"

# M3 application lifecycle targets are checked against Cargo metadata.
[[future_crates]]
name = "intention-application"
responsibility = "Commands, queries, use cases, and transaction orchestration."
test_target = "use-case and architecture tests"
test_targets = ["m3_application", "m4_application_scheduling"]
coverage_tier = "B"

[[future_crates]]
name = "intention-runtime"
responsibility = "Session and run actors, model-loop coordination, cancellation, and lifecycle."
test_target = "deterministic actor integration tests"
test_targets = ["m3_runtime", "m4_application_scheduling", "m4_model_execution"]
coverage_tier = "B"

[[future_crates]]
name = "intention-storage"
responsibility = "Repository, unit-of-work, snapshot, and event-log contracts."
test_target = "repository contract tests"
test_targets = ["contracts", "m4_model_context", "m4_run_replay_contracts", "m4_run_safe_config"]
coverage_tier = "B"

[[future_crates]]
name = "intention-storage-sqlite"
responsibility = "SQLite schema, migrations, projections, and repository implementation."
test_target = "migration and transaction fault-injection tests"
test_targets = ["m4_durable_facts", "m4_model_context", "m4_run_safe_config", "sqlite_contracts"]
coverage_tier = "B"

[[future_crates]]
name = "intention-config"
responsibility = "TOML parsing, validation, migrations, and resolved configuration DTOs."
test_target = "configuration fixture tests"
test_targets = ["contracts", "snapshot_fixtures", "m3_contracts", "m4_contracts"]
coverage_tier = "A"

[[future_crates]]
name = "intention-model"
responsibility = "Provider-neutral model DTOs and driver contract."
test_target = "model contract and stream tests"
test_targets = ["model_contracts", "m4_execution_contracts", "m4_reexports"]
coverage_tier = "C"

[[future_crates]]
name = "intention-provider-openrouter"
responsibility = "OpenRouter SDK translation."
test_target = "provider stream and error fixtures"
test_targets = ["openrouter_contracts"]
coverage_tier = "C"

[[future_crates]]
name = "intention-provider-generic-chat"
responsibility = "Generic Chat Completion translation."
test_target = "provider stream and capability fixtures"
test_targets = ["generic_chat_contracts"]
coverage_tier = "C"

[[future_crates]]
name = "intention-tools"
responsibility = "Typed tool registry and core tool contracts."
test_target = "tool invocation and policy tests"
test_targets = ["tool_contracts"]
coverage_tier = "B"

[[future_crates]]
name = "intention-workspace"
responsibility = "WorkspaceRoot path policy and process CWD enforcement."
test_target = "workspace containment tests"
test_targets = ["workspace_contract"]
coverage_tier = "B"

[[future_crates]]
name = "intention-hooks"
responsibility = "Typed hook phases, ordering, contexts, and dispatch."
test_target = "hook ordering and rejection tests"
test_targets = ["hook_contracts"]
coverage_tier = "B"

[[future_crates]]
name = "intention-vfr"
responsibility = "VFR transformation, mapping, expansion, and raw-read tools."
test_target = "transform and expansion outcome tests"
test_targets = []
coverage_tier = "B"

[[future_crates]]
name = "intention-headroom"
responsibility = "Headroom transform, CCR retention, and retrieve tool."
test_target = "compression, retrieval, and expiry tests"
test_targets = []
coverage_tier = "B"

[[future_crates]]
name = "intention-plans"
responsibility = "Plan artifacts, hidden frontmatter, and Plan/Build policy."
test_target = "plan integrity, focus, approval, and mode-policy tests"
test_targets = []
coverage_tier = "B"

[[future_crates]]
name = "intention-protocol"
responsibility = "Versioned transport commands, queries, and events."
test_target = "protocol compatibility fixtures"
test_targets = ["contracts", "protocol_fixtures", "accessors", "m3_contracts", "m4_run_stream_contracts"]
coverage_tier = "A"

[[future_crates]]
name = "intention-transport"
responsibility = "Socket framing, server/client protocol, and subscriptions."
test_target = "transport integration tests"
test_targets = ["transport_integration"]
coverage_tier = "C"

[[future_crates]]
name = "intention-client"
responsibility = "Bootstrap, command dispatch, subscription, and reconnect."
test_target = "client contract and reconnect tests"
test_targets = ["client_contract", "run_stream_contract"]
coverage_tier = "C"

[[future_crates]]
name = "intention"
responsibility = "Composition root, factories, and daemon application facade."
test_target = "composition wiring smoke tests"
test_targets = []
coverage_tier = "C"

[[future_crates]]
name = "intention-test-support"
responsibility = "Non-production durable integration fixtures and contract scenarios."
test_target = "fixture and composition contract tests"
test_targets = ["composition_contract", "fixture_host"]
coverage_tier = "adapter"

[[future_crates]]
name = "intention-daemon"
responsibility = "Daemon host binary, lifecycle, and typed connection hosting."
test_target = "bootstrap, recovery, and model-execution bridge integration tests"
test_targets = ["daemon_bootstrap", "m4_streaming_foundation"]
coverage_tier = "C"

[[future_crates]]
name = "intention-tauri"
responsibility = "Tauri bootstrap and native bridge."
test_target = "mapping contract and fixture-daemon smoke tests"
test_targets = []
coverage_tier = "adapter"

[[future_crates]]
name = "intention-tui"
responsibility = "TUI and REPL presentation adapters."
test_target = "mapping contract and fixture-daemon smoke tests"
test_targets = ["tui_contract"]
coverage_tier = "adapter"
