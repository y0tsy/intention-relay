[toolchains]
stable = "1.97.1"
nightly = "nightly-2026-07-31"
nightly_rustc_version = "1.99.0-nightly"

[components]
stable = ["rustfmt", "clippy", "llvm-tools-preview"]
nightly = ["rustfmt", "clippy", "llvm-tools-preview"]

[[tools]]
name = "cargo-nextest"
version = "0.9.140"
command = ["cargo", "nextest", "--version"]

[[tools]]
name = "cargo-llvm-cov"
version = "0.8.7"
command = ["cargo", "llvm-cov", "--version"]

[[tools]]
name = "cargo-deny"
version = "0.20.2"
command = ["cargo", "deny", "--version"]

[[tools]]
name = "cargo-audit"
version = "0.22.2"
command = ["cargo", "audit", "--version"]

[[tools]]
name = "cargo-udeps"
version = "0.1.61"
command = ["cargo", "+nightly-2026-07-31", "udeps", "--version"]

[[tools]]
name = "cargo-machete"
version = "0.9.2"
command = ["cargo", "machete", "--version"]

[[tools]]
name = "cargo-outdated"
version = "0.19.0"
command = ["cargo", "outdated", "--version"]
