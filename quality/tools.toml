[toolchains]
stable = "1.97.1"

[components]
stable = ["rustfmt", "clippy", "llvm-tools-preview"]

[[tools]]
name = "cargo-nextest"
version = "0.9.140"
command = ["cargo", "nextest", "--version"]

[[tools]]
name = "cargo-llvm-cov"
version = "0.8.7"
command = ["cargo", "llvm-cov", "--version"]

[[tools]]
name = "cargo-deny"
version = "0.20.2"
command = ["cargo", "deny", "--version"]

[[tools]]
name = "cargo-machete"
version = "0.9.2"
command = ["cargo", "machete", "--version"]
