[tiers]
A = 95.0
B = 90.0
C = 85.0

[policy]
phase = "m5"
# Coverage is collected with one isolated Cargo package invocation per profile.
coverage_crates = [
  "intention-types",
  "intention-domain",
  "intention-protocol",
  "intention-config",
  "intention-transport",
  "intention-client",
  "intention",
  "intention-daemon",
  "intention-application",
  "intention-runtime",
  "intention-storage",
  "intention-storage-sqlite",
  "intention-model",
  "intention-provider-openrouter",
  "intention-provider-generic-chat",
  "intention-tools",
  "intention-workspace",
  "intention-hooks",
]
production_crates = [
  "intention-types",
  "intention-domain",
  "intention-protocol",
  "intention-config",
  "intention-transport",
  "intention-client",
  "intention",
  "intention-daemon",
  "intention-application",
  "intention-runtime",
  "intention-storage",
  "intention-storage-sqlite",
  "intention-model",
  "intention-provider-openrouter",
  "intention-provider-generic-chat",
  "intention-tools",
  "intention-workspace",
  "intention-hooks",
]
adapter_crates = ["intention-tauri", "intention-tui"]

[crate_tiers]
"intention-types" = "A"
"intention-domain" = "A"
"intention-protocol" = "A"
"intention-config" = "A"
"intention-transport" = "C"
"intention-client" = "C"
"intention" = "C"
"intention-daemon" = "C"
"intention-application" = "B"
"intention-runtime" = "B"
"intention-storage" = "B"
"intention-storage-sqlite" = "B"
"intention-model" = "C"
"intention-provider-openrouter" = "C"
"intention-provider-generic-chat" = "C"
"intention-tools" = "B"
"intention-workspace" = "B"
"intention-hooks" = "B"

# Approved M5 exception: these newly activated boundary crates have an 80%
# floor while their semantic safety contracts remain mandatory. The override
# floor is separately documented in architecture/12-quality-gates-and-makefile.md.
[coverage_overrides]
approved_floor = 80.0

[coverage_overrides.crates.intention-tools]
threshold = 80.0
rationale = "M5 tool boundary activation has an approved 80% transition floor while policy-denial and workspace-path semantic tests remain mandatory."
owner = "intention-tools"
review = "Reviewer: M5 quality council; date: 2026-08-26; decision: M5-approved transition floor; revisit before the next milestone gate."

[coverage_overrides.crates.intention-hooks]
threshold = 80.0
rationale = "M5 hook boundary activation has an approved 80% transition floor while ordering, rejection, and short-circuit semantic tests remain mandatory."
owner = "intention-hooks"
review = "Reviewer: M5 quality council; date: 2026-08-26; decision: M5-approved transition floor; revisit before the next milestone gate."

[[exclusions]]
enabled = true
path = "crates/intention-daemon/src/main.rs"
rationale = "The thin process adapter runs only in child daemon processes, whose Windows llvm-cov instrumentation is not merged into the parent nextest report."
owner = "intention-daemon"
equivalent_test_evidence = "crates/intention-daemon/tests/daemon_bootstrap.rs starts the real binary for unsafe-argument rejection and concurrent shared-session bootstrap."
