[policy]
phase = "m5"
# Every production crate and the workspace aggregate must satisfy the base
# line-coverage threshold.
base_threshold_percent = 80.0
designated_threshold_percent = 85.0
# Designated files carry the higher per-file threshold. The list is empty at
# adoption; each entry declares a workspace-relative `path` under a production
# crate `src` root plus a `rationale`:
# [[designated_files]]
# path = "crates/example/src/lib.rs"
# rationale = "Why this file carries the higher bar."
# Coverage is collected with one isolated Cargo package invocation per profile.
coverage_crates = [
  "intention-types",
  "intention-domain",
  "intention-protocol",
  "intention-config",
  "intention-transport",
  "intention-client",
  "intention",
  "intention-daemon",
  "intention-application",
  "intention-runtime",
  "intention-storage",
  "intention-storage-sqlite",
  "intention-model",
  "intention-provider-openrouter",
  "intention-provider-generic-chat",
  "intention-tools",
  "intention-workspace",
  "intention-hooks",
]
production_crates = [
  "intention-types",
  "intention-domain",
  "intention-protocol",
  "intention-config",
  "intention-transport",
  "intention-client",
  "intention",
  "intention-daemon",
  "intention-application",
  "intention-runtime",
  "intention-storage",
  "intention-storage-sqlite",
  "intention-model",
  "intention-provider-openrouter",
  "intention-provider-generic-chat",
  "intention-tools",
  "intention-workspace",
  "intention-hooks",
]
adapter_crates = ["intention-tauri", "intention-tui"]

[[exclusions]]
enabled = true
path = "crates/intention-daemon/src/main.rs"
rationale = "The thin process adapter entry point runs only in child daemon processes; it carries no library logic, and unsafe-argument rejection and concurrent shared-session bootstrap are exercised through the real binary in daemon_bootstrap tests."
owner = "intention-daemon"
equivalent_test_evidence = "crates/intention-daemon/tests/daemon_bootstrap.rs starts the real binary for unsafe-argument rejection and concurrent shared-session bootstrap."
