[tiers]
A = 95.0
B = 90.0
C = 85.0

[policy]
phase = "m5"
# Coverage is collected with one isolated Cargo package invocation per profile.
coverage_crates = [
  "intention-types",
  "intention-domain",
  "intention-protocol",
  "intention-config",
  "intention-transport",
  "intention-client",
  "intention",
  "intention-daemon",
  "intention-application",
  "intention-runtime",
  "intention-storage",
  "intention-storage-sqlite",
  "intention-model",
  "intention-provider-openrouter",
  "intention-provider-generic-chat",
  "intention-tools",
  "intention-workspace",
  "intention-hooks",
]
production_crates = [
  "intention-types",
  "intention-domain",
  "intention-protocol",
  "intention-config",
  "intention-transport",
  "intention-client",
  "intention",
  "intention-daemon",
  "intention-application",
  "intention-runtime",
  "intention-storage",
  "intention-storage-sqlite",
  "intention-model",
  "intention-provider-openrouter",
  "intention-provider-generic-chat",
  "intention-tools",
  "intention-workspace",
  "intention-hooks",
]
adapter_crates = ["intention-tauri", "intention-tui"]

# CI splits each coverage profile into two parallel jobs (group a and group
# b) so the per-profile critical path is the slower group instead of the
# serial sum. Group boundaries preserve the coverage_crates compile order,
# and the workspace aggregate report runs once per profile with group a.
# Groups are balanced against measured per-crate collection times: group b
# keeps the daemon compile anchor plus the heavy test suites (sqlite,
# transport), group a keeps the intention compile anchor plus the provider
# suites.
[groups]
a = [
  "intention-types",
  "intention-domain",
  "intention-protocol",
  "intention-config",
  "intention-client",
  "intention",
  "intention-provider-generic-chat",
  "intention-provider-openrouter",
]
b = [
  "intention-transport",
  "intention-daemon",
  "intention-application",
  "intention-runtime",
  "intention-storage",
  "intention-storage-sqlite",
  "intention-model",
  "intention-tools",
  "intention-workspace",
  "intention-hooks",
]

[crate_tiers]
"intention-types" = "A"
"intention-domain" = "A"
"intention-protocol" = "A"
"intention-config" = "A"
"intention-transport" = "C"
"intention-client" = "C"
"intention" = "C"
"intention-daemon" = "C"
"intention-application" = "B"
"intention-runtime" = "B"
"intention-storage" = "B"
"intention-storage-sqlite" = "B"
"intention-model" = "C"
"intention-provider-openrouter" = "C"
"intention-provider-generic-chat" = "C"
"intention-tools" = "B"
"intention-workspace" = "B"
"intention-hooks" = "B"

[[exclusions]]
enabled = true
path = "crates/intention-daemon/src/main.rs"
rationale = "The thin process adapter entry point runs only in child daemon processes; it carries no library logic, and unsafe-argument rejection and concurrent shared-session bootstrap are exercised through the real binary in daemon_bootstrap tests."
owner = "intention-daemon"
equivalent_test_evidence = "crates/intention-daemon/tests/daemon_bootstrap.rs starts the real binary for unsafe-argument rejection and concurrent shared-session bootstrap."
