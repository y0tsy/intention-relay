[tiers]
A = 95.0
B = 90.0
C = 85.0

[policy]
phase = "m5"
# Coverage is collected with one isolated Cargo package invocation per profile.
coverage_crates = [
  "intention-types",
  "intention-domain",
  "intention-protocol",
  "intention-config",
  "intention-transport",
  "intention-client",
  "intention",
  "intention-daemon",
  "intention-application",
  "intention-runtime",
  "intention-storage",
  "intention-storage-sqlite",
  "intention-model",
  "intention-provider-openrouter",
  "intention-provider-generic-chat",
  "intention-tools",
  "intention-workspace",
  "intention-hooks",
]
production_crates = [
  "intention-types",
  "intention-domain",
  "intention-protocol",
  "intention-config",
  "intention-transport",
  "intention-client",
  "intention",
  "intention-daemon",
  "intention-application",
  "intention-runtime",
  "intention-storage",
  "intention-storage-sqlite",
  "intention-model",
  "intention-provider-openrouter",
  "intention-provider-generic-chat",
  "intention-tools",
  "intention-workspace",
  "intention-hooks",
]
adapter_crates = ["intention-tauri", "intention-tui"]

[crate_tiers]
"intention-types" = "A"
"intention-domain" = "A"
"intention-protocol" = "A"
"intention-config" = "A"
"intention-transport" = "C"
"intention-client" = "C"
"intention" = "C"
"intention-daemon" = "C"
"intention-application" = "B"
"intention-runtime" = "B"
"intention-storage" = "B"
"intention-storage-sqlite" = "B"
"intention-model" = "C"
"intention-provider-openrouter" = "C"
"intention-provider-generic-chat" = "C"
"intention-tools" = "B"
"intention-workspace" = "B"
"intention-hooks" = "B"

[[exclusions]]
enabled = true
path = "crates/intention-daemon/src/main.rs"
rationale = "The thin process adapter runs only in child daemon processes, whose Windows llvm-cov instrumentation is not merged into the parent nextest report."
owner = "intention-daemon"
equivalent_test_evidence = "crates/intention-daemon/tests/daemon_bootstrap.rs starts the real binary for unsafe-argument rejection and concurrent shared-session bootstrap."

# Explicit coverage target sets. The coverage runner narrows --all-targets
# only when a crate's declared set exactly equals its locked metadata target
# inventory; otherwise it fails closed and keeps --all-targets.
[[coverage_targets]]
crate = "intention-types"
targets = ["lib", "test"]

[[coverage_targets]]
crate = "intention-domain"
targets = ["lib", "test"]

[[coverage_targets]]
crate = "intention-protocol"
targets = ["lib", "test"]

[[coverage_targets]]
crate = "intention-config"
targets = ["lib", "test"]

[[coverage_targets]]
crate = "intention-transport"
targets = ["lib", "test"]

[[coverage_targets]]
crate = "intention-client"
targets = ["lib", "test"]

[[coverage_targets]]
crate = "intention"
targets = ["lib"]

[[coverage_targets]]
crate = "intention-daemon"
targets = ["lib", "bin", "test"]

[[coverage_targets]]
crate = "intention-application"
targets = ["lib", "test"]

[[coverage_targets]]
crate = "intention-runtime"
targets = ["lib", "test"]

[[coverage_targets]]
crate = "intention-storage"
targets = ["lib", "test"]

[[coverage_targets]]
crate = "intention-storage-sqlite"
targets = ["lib", "test"]

[[coverage_targets]]
crate = "intention-model"
targets = ["lib", "test"]

[[coverage_targets]]
crate = "intention-provider-openrouter"
targets = ["lib", "test"]

[[coverage_targets]]
crate = "intention-provider-generic-chat"
targets = ["lib", "test"]

[[coverage_targets]]
crate = "intention-tools"
targets = ["lib", "test"]

[[coverage_targets]]
crate = "intention-workspace"
targets = ["lib", "test"]

[[coverage_targets]]
crate = "intention-hooks"
targets = ["lib", "test"]
