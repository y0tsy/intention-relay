[policy]
phase = "slice2"
# A collected crate Cargo declares with no test-executing target is skipped
# only when it is listed here; an undeclared skip fails the coverage run, and a
# declaration whose crate does have a test target fails as stale.
unexecutable_crates = []

# Line-coverage floors. [crate_tiers] assigns every active production crate and
# every adapter package to exactly one tier; the runner collects every crate
# whose tier is above zero with one isolated line-only Cargo package
# invocation, and exempt crates stay outside collection and every aggregate.
[tiers]
core = 75.0
standard = 60.0
edge = 20.0
exempt = 0.0

[crate_tiers]
"intention-transport" = "core"
"intention-storage" = "core"
"intention-engine" = "core"
"intention-tools" = "standard"
"intention-config" = "standard"
"intention-daemon" = "standard"
"intention-providers" = "standard"
"intention-tui" = "edge"
"intention-client" = "edge"
"intention-proto" = "exempt"

[[exclusions]]
enabled = true
path = "crates/intention-daemon/src/main.rs"
rationale = "The thin process adapter entry point runs only in child daemon processes; it carries no library logic, and unsafe-argument rejection and concurrent shared-session bootstrap are exercised through the real binary in daemon_bootstrap tests."
owner = "intention-daemon"
equivalent_test_evidence = "crates/intention-daemon/tests/daemon_bootstrap.rs starts the real binary for unsafe-argument rejection and concurrent shared-session bootstrap."
