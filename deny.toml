[graph]
all-features = true
no-default-features = false

[advisories]
version = 2
ignore = []

[licenses]
version = 2
allow = ["Apache-2.0", "MIT", "Unicode-3.0", "0BSD", "Zlib"]
confidence-threshold = 0.8
exceptions = []

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
deny = []
skip = [
  { crate = "hashbrown@0.16.1", reason = "M3 reviewed target-specific duplicate: required only by rusqlite 0.40.1 -> sqlite-wasm-rs -> rsqlite-vfs on WASM targets; retain native bundled SQLite and reassess when that target chain no longer requires hashbrown 0.16." },
  { crate = "syn@2.0.119", reason = "M3 reviewed target-specific duplicate: required only by rusqlite 0.40.1 -> sqlite-wasm-rs -> wasm-bindgen on WASM targets; retain native bundled SQLite and reassess when that target chain no longer requires syn 2." },
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
