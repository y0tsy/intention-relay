name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: make ci
    runs-on: ubuntu-24.04
    env:
      CARGO_TERM_COLOR: never
      CARGO_HOME: ${{ github.workspace }}/.cargo-home
      RUSTUP_HOME: ${{ github.workspace }}/.rustup-home
    steps:
      - uses: actions/checkout@v4

      - name: Restore quality caches
        uses: actions/cache@v4
        with:
          path: |
            .cargo-home/bin
            .cargo-home/registry
            .cargo-home/advisory-db
            .cargo-home/git
            .rustup-home
            target
            quality/reports
          key: quality-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'quality/tools.toml', 'quality/features.toml', 'Cargo.lock', 'deny.toml') }}
          restore-keys: |
            quality-${{ runner.os }}-

      - name: Install pinned Rust toolchains
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup toolchain install nightly-2026-07-31 --profile minimal
          rustup component add rustfmt clippy llvm-tools-preview --toolchain 1.97.1
          rustup component add rustfmt clippy llvm-tools-preview --toolchain nightly-2026-07-31

      - name: Install pinned quality tools
        run: make bootstrap-tools

      - name: Expose canonical Cargo binaries
        run: echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - name: Run repository quality gate
        run: make ci

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          if-no-files-found: ignore
          path: |
            quality/reports
            target/nextest
