name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: ${{ matrix.os }} ${{ matrix.phase }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Per-phase toolchain/tool scoping keeps every job lean: each phase
          # installs and validates only what it runs. The union of all scopes
          # equals the complete pinned toolset.
          - os: ubuntu-24.04
            phase: lint-arch
            stable: true
            nightly: false
            stable_components: "rustfmt, clippy"
            nightly_components: ""
            tools: ""
            scope: lint-arch
            rustflags: "-C link-arg=-fuse-ld=mold"
          - os: ubuntu-24.04
            phase: test
            stable: true
            nightly: false
            stable_components: ""
            nightly_components: ""
            tools: "cargo-nextest@0.9.140"
            scope: test
            rustflags: "-C link-arg=-fuse-ld=mold"
          - os: ubuntu-24.04
            phase: coverage-default
            stable: false
            nightly: true
            stable_components: ""
            nightly_components: "llvm-tools-preview"
            tools: "cargo-nextest@0.9.140,cargo-llvm-cov@0.8.7"
            scope: coverage
            rustflags: "-C link-arg=-fuse-ld=mold"
          - os: ubuntu-24.04
            phase: coverage-no-default
            stable: false
            nightly: true
            stable_components: ""
            nightly_components: "llvm-tools-preview"
            tools: "cargo-nextest@0.9.140,cargo-llvm-cov@0.8.7"
            scope: coverage
            rustflags: "-C link-arg=-fuse-ld=mold"
          - os: ubuntu-24.04
            phase: coverage-all
            stable: false
            nightly: true
            stable_components: ""
            nightly_components: "llvm-tools-preview"
            tools: "cargo-nextest@0.9.140,cargo-llvm-cov@0.8.7"
            scope: coverage
            rustflags: "-C link-arg=-fuse-ld=mold"
          - os: ubuntu-24.04
            phase: selftest
            stable: true
            nightly: false
            stable_components: "rustfmt, clippy"
            nightly_components: ""
            tools: "cargo-machete@0.9.2,cargo-outdated@0.19.0,cargo-about@0.9.1"
            scope: selftest
            rustflags: "-C link-arg=-fuse-ld=mold"
          - os: ubuntu-24.04
            phase: deps
            stable: true
            nightly: true
            stable_components: ""
            nightly_components: ""
            tools: "cargo-deny@0.20.2,cargo-audit@0.22.2,cargo-about@0.9.1,cargo-outdated@0.19.0,cargo-machete@0.9.2,cargo-udeps@0.1.61"
            scope: deps
            rustflags: "-C link-arg=-fuse-ld=mold"
          - os: windows-2025
            phase: lint-arch
            stable: true
            nightly: false
            stable_components: "rustfmt, clippy"
            nightly_components: ""
            tools: ""
            scope: lint-arch
            rustflags: ""
          - os: windows-2025
            phase: test
            stable: true
            nightly: false
            stable_components: ""
            nightly_components: ""
            tools: "cargo-nextest@0.9.140"
            scope: test
            rustflags: ""
          - os: windows-2025
            phase: coverage-default
            stable: false
            nightly: true
            stable_components: ""
            nightly_components: "llvm-tools-preview"
            tools: "cargo-nextest@0.9.140,cargo-llvm-cov@0.8.7"
            scope: coverage
            rustflags: ""
          - os: windows-2025
            phase: coverage-no-default
            stable: false
            nightly: true
            stable_components: ""
            nightly_components: "llvm-tools-preview"
            tools: "cargo-nextest@0.9.140,cargo-llvm-cov@0.8.7"
            scope: coverage
            rustflags: ""
          - os: windows-2025
            phase: coverage-all
            stable: false
            nightly: true
            stable_components: ""
            nightly_components: "llvm-tools-preview"
            tools: "cargo-nextest@0.9.140,cargo-llvm-cov@0.8.7"
            scope: coverage
            rustflags: ""
          - os: windows-2025
            phase: selftest
            stable: true
            nightly: false
            stable_components: "rustfmt, clippy"
            nightly_components: ""
            tools: "cargo-machete@0.9.2,cargo-outdated@0.19.0,cargo-about@0.9.1"
            scope: selftest
            rustflags: ""
          - os: windows-2025
            phase: deps
            stable: true
            nightly: true
            stable_components: ""
            nightly_components: ""
            tools: "cargo-deny@0.20.2,cargo-audit@0.22.2,cargo-about@0.9.1,cargo-outdated@0.19.0,cargo-machete@0.9.2,cargo-udeps@0.1.61"
            scope: deps
            rustflags: ""
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: ${{ matrix.rustflags }}
      CI_TOOLS_SCOPE: ${{ matrix.scope }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Restore Cargo and build caches
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ${{ matrix.phase }}

      - name: Install stable Rust toolchain
        if: matrix.stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          components: ${{ matrix.stable_components }}

      - name: Install nightly Rust toolchain
        if: matrix.nightly
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly-2026-07-31
          components: ${{ matrix.nightly_components }}

      - name: Install pinned quality tools
        if: matrix.tools != ''
        uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc
        with:
          tool: ${{ matrix.tools }}
          fallback: cargo-binstall

      - name: Install mold linker
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mold

      - name: Set canonical Rust homes
        run: |
          echo "CARGO_HOME=$HOME/.cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$HOME/.rustup" >> "$GITHUB_ENV"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Report disk space before quality gate
        run: df -h . "$HOME"

      - name: Run repository quality gate (${{ matrix.phase }})
        run: make ci-${{ matrix.phase }}

      - name: Report disk space after quality gate
        if: always()
        run: df -h . "$HOME"

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-reports-${{ runner.os }}-${{ matrix.phase }}
          if-no-files-found: ignore
          path: |
            quality/reports
            target/nextest
