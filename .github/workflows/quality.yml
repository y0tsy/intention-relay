name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: ${{ matrix.os }} ${{ matrix.phase }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            phase: source
          - os: ubuntu-24.04
            phase: coverage
          - os: ubuntu-24.04
            phase: deps
          - os: windows-2025
            phase: source
          - os: windows-2025
            phase: coverage
          - os: windows-2025
            phase: deps
    env:
      CARGO_TERM_COLOR: never
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Restore Cargo registry cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/advisory-db
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      - name: Restore Cargo git cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/git
          key: cargo-git-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-git-${{ runner.os }}-

      - name: Restore Rustup cache
        uses: actions/cache@v6
        with:
          path: ~/.rustup
          key: rustup-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}
          restore-keys: rustup-${{ runner.os }}-

      - name: Restore quality tools cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin
          key: quality-tools-${{ runner.os }}-${{ hashFiles('quality/tools.toml') }}
          restore-keys: quality-tools-${{ runner.os }}-

      - name: Set canonical Rust homes
        run: |
          echo "CARGO_HOME=$HOME/.cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$HOME/.rustup" >> "$GITHUB_ENV"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Configure bounded CI build directory
        run: |
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/intention-relay-target" >> "$GITHUB_ENV"

      - name: Install pinned Rust toolchains
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup toolchain install nightly-2026-07-31 --profile minimal
          rustup component add rustfmt clippy llvm-tools-preview --toolchain 1.97.1
          rustup component add rustfmt clippy llvm-tools-preview --toolchain nightly-2026-07-31

      - name: Install pinned quality tools
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60
        with:
          tool: |
            cargo-nextest@0.9.140
            cargo-llvm-cov@0.8.7
            cargo-deny@0.20.2
            cargo-audit@0.22.2
            cargo-udeps@0.1.61
            cargo-machete@0.9.2
            cargo-about@0.9.1
            cargo-outdated@0.19.0
          fallback: cargo-binstall

      - name: Report disk space before quality gate
        run: |
          df -h . "$HOME" "${RUNNER_TEMP:-/tmp}"
          for path in "${CARGO_TARGET_DIR}" quality/reports "$HOME/.cargo/registry" "$HOME/.rustup"; do
            if [ -e "$path" ]; then
              du -sh "$path"
            else
              printf '%s: absent\n' "$path"
            fi
          done

      - name: Run repository quality gate (${{ matrix.phase }})
        run: make ci-${{ matrix.phase }}

      - name: Report disk space after quality gate
        if: always()
        run: |
          df -h . "$HOME" "${RUNNER_TEMP:-/tmp}"
          for path in "${CARGO_TARGET_DIR}" quality/reports "$HOME/.cargo/registry" "$HOME/.rustup"; do
            if [ -e "$path" ]; then
              du -sh "$path"
            else
              printf '%s: absent\n' "$path"
            fi
          done

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports-${{ runner.os }}-${{ matrix.phase }}
          if-no-files-found: ignore
          path: |
            quality/reports
            ${{ runner.temp }}/intention-relay-target/nextest
