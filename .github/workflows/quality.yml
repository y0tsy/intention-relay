name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: make ci
    runs-on: ubuntu-24.04
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4

      - name: Restore quality caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/advisory-db
            ~/.cargo/git
            ~/.rustup
            target
            quality/reports
          key: quality-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'quality/tools.toml', 'quality/features.toml', 'Cargo.lock', 'deny.toml') }}
          restore-keys: |
            quality-${{ runner.os }}-

      - name: Set canonical Rust homes
        run: |
          echo "CARGO_HOME=$HOME/.cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$HOME/.rustup" >> "$GITHUB_ENV"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install pinned Rust toolchains
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup toolchain install nightly-2026-07-31 --profile minimal
          rustup component add rustfmt clippy llvm-tools-preview --toolchain 1.97.1
          rustup component add rustfmt clippy llvm-tools-preview --toolchain nightly-2026-07-31

      - name: Install pinned quality tools
        run: make bootstrap-tools

      - name: Run repository quality gate
        run: make ci

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          if-no-files-found: ignore
          path: |
            quality/reports
            target/nextest
