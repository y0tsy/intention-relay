name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# One in-flight run per workflow and PR number or ref. Pull requests cancel
# superseded runs (new commits replace older work); push runs never cancel,
# so main and other branches always execute their latest queued commit.
concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: ${{ matrix.os }} ${{ matrix.phase }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Per-phase toolchain/tool scoping keeps every job lean: each phase
          # installs and validates only what it runs. The union of all scopes
          # equals the complete pinned toolset.
          #
          # lint-arch and test run on both Linux and Windows; coverage (all
          # three profiles), selftest, and deps run on Linux only. Those three
          # phases are platform-invariant: coverage measures the same source
          # and toolchain, the selftest fixtures are Python/git subprocess
          # checks, and the dependency gates read the same lockfile and
          # registries. The Windows coverage trio dominated the CI critical
          # path at roughly twenty minutes while running identical work about
          # 1.7x slower than Linux; Windows correctness stays covered by the
          # test job's named-pipe and platform-native symlink fixtures.
          - os: ubuntu-24.04
            phase: lint-arch
            stable: true
            nightly: false
            stable_components: "rustfmt, clippy"
            nightly_components: ""
            tools: ""
            scope: lint-arch
            rustflags: "-C link-arg=-fuse-ld=mold"
            uses_mold: true
          - os: ubuntu-24.04
            phase: test
            stable: true
            nightly: false
            stable_components: ""
            nightly_components: ""
            tools: "cargo-nextest@0.9.140"
            scope: test
            rustflags: "-C link-arg=-fuse-ld=mold"
            uses_mold: true
          - os: ubuntu-24.04
            phase: coverage-default
            stable: false
            nightly: true
            stable_components: ""
            nightly_components: "llvm-tools-preview"
            tools: "cargo-nextest@0.9.140,cargo-llvm-cov@0.8.7"
            scope: coverage
            rustflags: "-C link-arg=-fuse-ld=mold"
            uses_mold: true
          - os: ubuntu-24.04
            phase: coverage-no-default
            stable: false
            nightly: true
            stable_components: ""
            nightly_components: "llvm-tools-preview"
            tools: "cargo-nextest@0.9.140,cargo-llvm-cov@0.8.7"
            scope: coverage
            rustflags: "-C link-arg=-fuse-ld=mold"
            uses_mold: true
          - os: ubuntu-24.04
            phase: coverage-all
            stable: false
            nightly: true
            stable_components: ""
            nightly_components: "llvm-tools-preview"
            tools: "cargo-nextest@0.9.140,cargo-llvm-cov@0.8.7"
            scope: coverage
            rustflags: "-C link-arg=-fuse-ld=mold"
            uses_mold: true
          - os: ubuntu-24.04
            phase: selftest
            stable: true
            nightly: false
            stable_components: "rustfmt, clippy"
            nightly_components: ""
            tools: "cargo-machete@0.9.2,cargo-outdated@0.19.0,cargo-about@0.9.1"
            scope: selftest
            rustflags: "-C link-arg=-fuse-ld=mold"
            uses_mold: true
          - os: ubuntu-24.04
            phase: deps
            stable: true
            nightly: true
            stable_components: ""
            nightly_components: ""
            tools: "cargo-deny@0.20.2,cargo-audit@0.22.2,cargo-about@0.9.1,cargo-outdated@0.19.0,cargo-machete@0.9.2,cargo-udeps@0.1.61"
            scope: deps
            rustflags: "-C link-arg=-fuse-ld=mold"
            uses_mold: true
          - os: windows-2025
            phase: lint-arch
            stable: true
            nightly: false
            stable_components: "rustfmt, clippy"
            nightly_components: ""
            tools: ""
            scope: lint-arch
            rustflags: ""
            uses_mold: false
          - os: windows-2025
            phase: test
            stable: true
            nightly: false
            stable_components: ""
            nightly_components: ""
            tools: "cargo-nextest@0.9.140"
            scope: test
            rustflags: ""
            uses_mold: false
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: ${{ matrix.rustflags }}
      CI_TOOLS_SCOPE: ${{ matrix.scope }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Restore Cargo and build caches
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ${{ matrix.phase }}

      - name: Install stable Rust toolchain
        if: matrix.stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          components: ${{ matrix.stable_components }}

      - name: Install nightly Rust toolchain
        if: matrix.nightly
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly-2026-07-31
          components: ${{ matrix.nightly_components }}

      - name: Install pinned quality tools
        if: matrix.tools != ''
        uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc
        with:
          tool: ${{ matrix.tools }}
          fallback: cargo-binstall

      - name: Enable sccache object cache for coverage builds
        if: matrix.scope == 'coverage'
        uses: mozilla-actions/sccache-action@fd02668681acd5f960e1372061bee5e3e987195c
        with:
          version: "v0.17.0"

      - name: Route coverage builds through the sccache object cache
        if: matrix.scope == 'coverage'
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          # cargo-llvm-cov installs its own RUSTC_WRAPPER; a pre-existing
          # wrapper is honored only from the cargo build.rustc_wrapper
          # config, so sccache is wired through that config key. Rustup
          # resolves the chained `rustc` through RUSTUP_TOOLCHAIN, which
          # cargo +nightly keeps set for its child processes.
          echo "CARGO_BUILD_RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

      - name: Install mold linker
        # Only Linux jobs that actually link with mold install it; the
        # version check verifies the install without hiding its failure.
        if: runner.os == 'Linux' && matrix.uses_mold
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mold
          mold --version

      - name: Set canonical Rust homes
        run: |
          echo "CARGO_HOME=$HOME/.cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$HOME/.rustup" >> "$GITHUB_ENV"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Report disk space before quality gate
        run: df -h . "$HOME"

      - name: Collect runner metrics before quality gate (coverage)
        if: matrix.scope == 'coverage'
        run: python3 quality/collect_runner_metrics.py --label before --phase ${{ matrix.phase }} --out quality/reports/runner-metrics-${{ matrix.phase }}-before.json

      - name: Run repository quality gate (${{ matrix.phase }})
        run: make ci-${{ matrix.phase }}

      - name: Collect runner metrics after quality gate (coverage)
        if: always() && matrix.scope == 'coverage'
        run: python3 quality/collect_runner_metrics.py --label after --phase ${{ matrix.phase }} --out quality/reports/runner-metrics-${{ matrix.phase }}-after.json

      - name: Report disk space after quality gate
        if: always()
        run: df -h . "$HOME"

      - name: Collect sccache statistics (raw and diagnostic)
        # Observational only: the collector always exits 0 (writing null
        # fields when statistics are unavailable) so it never changes the
        # gate verdict, and the gate's own failure still fails the job.
        if: always() && matrix.scope == 'coverage'
        run: python3 quality/collect_sccache_metrics.py --sccache "${SCCACHE_PATH}" --reports quality/reports --phase ${{ matrix.phase }}

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-reports-${{ runner.os }}-${{ matrix.phase }}
          if-no-files-found: ignore
          path: |
            quality/reports
            target/nextest
