name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# One in-flight run per workflow and PR number or ref. Pull requests cancel
# superseded runs (new commits replace older work); push runs never cancel,
# so main and other branches always execute their latest queued commit.
concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: ${{ matrix.os }} ${{ matrix.phase }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every job installs only the tools its phase runs; `make ci-<phase>`
          # validates exactly that set through `quality/check_tools.py`, so no
          # job pays for a tool it does not use.
          #
          # Three Linux jobs and one Windows job carry the gate. lint-arch lints
          # the native target and the Windows target (through the MinGW cross
          # compiler), runs the doctests, and builds the rustdoc. Linux test
          # execution belongs to coverage-default, which runs the same
          # instrumented suite, so no separate Linux test job duplicates it. The
          # test phase runs on Windows, where the named-pipe and platform-native
          # symlink fixtures live. Coverage and deps stay on Linux: those phases
          # are platform-invariant, they measure the same source and toolchain,
          # and the Windows coverage jobs dominated the CI critical path at
          # roughly twenty minutes while running identical work about 1.7x
          # slower than Linux.
          #
          # Caching follows what each phase actually reuses. lint-arch and test
          # build a plain target tree that rust-cache keeps warm. coverage-default
          # deletes its instrumented target after the gate, so sccache carries
          # its objects and the registry cache carries the sources. deps compiles
          # nothing and needs only the registry. Only the coverage and lint jobs
          # link with mold, and only they pass the flag that selects it.
          - os: ubuntu-24.04
            phase: lint-arch
            stable: true
            stable_components: "rustfmt, clippy"
            tools: ""
            rustflags: "-C link-arg=-fuse-ld=mold"
            uses_mold: true
            uses_rust_cache: true
          - os: ubuntu-24.04
            phase: coverage-default
            stable: true
            stable_components: "llvm-tools-preview"
            tools: "cargo-nextest@0.9.140,cargo-llvm-cov@0.8.7"
            rustflags: "-C link-arg=-fuse-ld=mold"
            uses_mold: true
            uses_rust_cache: false
          - os: ubuntu-24.04
            phase: deps
            stable: true
            stable_components: ""
            tools: "cargo-deny@0.20.2,cargo-about@0.9.1,cargo-machete@0.9.2"
            rustflags: ""
            uses_mold: false
            uses_rust_cache: false
          - os: windows-2025
            phase: test
            stable: true
            stable_components: ""
            tools: "cargo-nextest@0.9.140"
            rustflags: ""
            uses_mold: false
            uses_rust_cache: true
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: ${{ matrix.rustflags }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Restore Cargo and build caches
        # The two jobs that compile a plain target tree keep it warm across
        # runs. The coverage job cannot: its instrumented target is deleted
        # after the gate so the tree stays disposable, and sccache serves its
        # objects instead. The deps job compiles nothing at all.
        if: matrix.uses_rust_cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ${{ matrix.phase }}

      - name: Restore the Cargo registry cache
        # What a warm object cache cannot replace is the crate sources: sccache
        # stores compiled objects only, so these jobs keep the registry and git
        # checkouts keyed by the committed lockfile.
        if: matrix.uses_rust_cache == false
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-

      - name: Install stable Rust toolchain
        if: matrix.stable
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: 1.97.1
          components: ${{ matrix.stable_components }}

      - name: Install pinned quality tools
        if: matrix.tools != ''
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad
        with:
          tool: ${{ matrix.tools }}
          fallback: cargo-binstall

      - name: Enable sccache object cache for coverage builds
        if: matrix.phase == 'coverage-default'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: "v0.17.0"

      - name: Route coverage builds through the sccache object cache
        if: matrix.phase == 'coverage-default'
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          # cargo-llvm-cov installs its own RUSTC_WRAPPER; a pre-existing
          # wrapper is honored only from the cargo build.rustc_wrapper
          # config, so sccache is wired through that config key.
          echo "CARGO_BUILD_RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          # The Rust side is cached by the wrapper above; the native builds
          # are not, and they are the longest single steps of the instrumented
          # build. `cc` and `cmake` read these variables, so the bundled
          # SQLite, mimalloc, and aws-lc-sys builds join the same cache.
          echo "CC=sccache gcc" >> "$GITHUB_ENV"
          echo "CXX=sccache g++" >> "$GITHUB_ENV"
          echo "CMAKE_C_COMPILER_LAUNCHER=sccache" >> "$GITHUB_ENV"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=sccache" >> "$GITHUB_ENV"

      - name: Install mold linker
        # The version check verifies the install without hiding its failure.
        # Only the Linux jobs that link with mold install it, and only those
        # jobs pass `-fuse-ld=mold`, so the binary is never made the system
        # default linker.
        if: runner.os == 'Linux' && matrix.uses_mold
        uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038
        with:
          mold-version: 2.30.0
          make-default: false

      - name: Verify the mold linker
        if: runner.os == 'Linux' && matrix.uses_mold
        run: mold --version

      - name: Set canonical Rust homes
        run: |
          echo "CARGO_HOME=$HOME/.cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$HOME/.rustup" >> "$GITHUB_ENV"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install the Windows cross target and MinGW toolchain
        # Version checks verify both installs without hiding their failure. The
        # target is declared in rust-toolchain.toml; the explicit install is
        # needed because CI installs the toolchain by literal name. MinGW
        # supplies the target C compiler the bundled C dependencies
        # (libsqlite3-sys, libmimalloc-sys, aws-lc-sys) build through `cc`, and
        # nasm is the assembler ring's Windows assembly path expects.
        if: matrix.phase == 'lint-arch'
        run: |
          rustup target add x86_64-pc-windows-gnu
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-mingw-w64-x86-64 nasm
          x86_64-w64-mingw32-gcc --version
          nasm --version

      - name: Report disk space before the quality gate
        run: df -h . "$HOME"

      - name: Run repository quality gate (${{ matrix.phase }})
        run: make ci-${{ matrix.phase }}

      - name: Report disk space after the quality gate
        # Paired with the reading before the gate: one measurement alone reports
        # nothing.
        if: always()
        run: df -h . "$HOME"

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-reports-${{ runner.os }}-${{ matrix.phase }}
          if-no-files-found: ignore
          path: |
            quality/reports
            target/nextest
