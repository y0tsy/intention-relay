name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: ${{ matrix.os }} make ci
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    env:
      CARGO_TERM_COLOR: never
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Restore Cargo registries and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/advisory-db
            ~/.cargo/git
            ~/.rustup
            target
            quality/reports
          key: quality-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'quality/tools.toml', 'quality/features.toml', 'Cargo.lock', 'deny.toml') }}
          restore-keys: |
            quality-${{ runner.os }}-

      - name: Set canonical Rust homes
        run: |
          echo "CARGO_HOME=$HOME/.cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$HOME/.rustup" >> "$GITHUB_ENV"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install pinned Rust toolchains
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup toolchain install nightly-2026-07-31 --profile minimal
          rustup component add rustfmt clippy llvm-tools-preview --toolchain 1.97.1
          rustup component add rustfmt clippy llvm-tools-preview --toolchain nightly-2026-07-31

      - name: Install pinned quality tools
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60
        with:
          tool: |
            cargo-nextest@0.9.140
            cargo-llvm-cov@0.8.7
            cargo-deny@0.20.2
            cargo-audit@0.22.2
            cargo-udeps@0.1.61
            cargo-machete@0.9.2
            cargo-about@0.9.1
            cargo-outdated@0.19.0
          fallback: cargo-binstall

      - name: Report disk space before quality gate
        run: |
          df -h . "$HOME" "${RUNNER_TEMP:-/tmp}"
          for path in target quality/reports "$HOME/.cargo/registry" "$HOME/.rustup"; do
            if [ -e "$path" ]; then
              du -sh "$path"
            else
              printf '%s: absent\n' "$path"
            fi
          done

      - name: Run repository quality gate
        run: make ci

      - name: Report disk space after quality gate
        if: always()
        run: |
          df -h . "$HOME" "${RUNNER_TEMP:-/tmp}"
          for path in target quality/reports "$HOME/.cargo/registry" "$HOME/.rustup"; do
            if [ -e "$path" ]; then
              du -sh "$path"
            else
              printf '%s: absent\n' "$path"
            fi
          done

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports-${{ runner.os }}
          if-no-files-found: ignore
          path: |
            quality/reports
            target/nextest
