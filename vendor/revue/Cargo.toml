    "*.rlib",
    "badge",
    "spinner",
    "tabs",
]
include = [
    "build.rs",
    "src/**/*.rs",
    "src/runtime/style/themes/*.css",
    "Cargo.toml",
    "LICENSE*",
    "README.md",
    "benches/**/*.rs",
    "examples/**/*.rs",
    "tests/**/*.rs",
]
autolib = false
autobins = false
autoexamples = false
