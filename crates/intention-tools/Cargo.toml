[package]
name = "intention-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
glob = "0.3.3"
intention-types = { path = "../intention-types", version = "=0.0.0" }
intention-workspace = { path = "../intention-workspace", version = "=0.0.0" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", default-features = false, features = ["std", "process"] }

[dev-dependencies]
intention-domain = { path = "../intention-domain", version = "=0.0.0" }
tempfile = "3.23.0"

[lints]
workspace = true
