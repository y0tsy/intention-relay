[package]
name = "intention-proto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Generates the TypeScript declarations of the wire types for the terminal app.
# The feature is off by default so no other consumer pays for the derive.
ts = ["dep:ts-rs"]

[dependencies]
schemars = { version = "=1.2.2", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
ts-rs = { version = "=12.0.1", optional = true, features = ["no-serde-warnings"] }
uuid = { version = "1.26.0", features = ["serde", "v4"] }

[dev-dependencies]
