[package]
name = "intention-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "intention-cli"
path = "src/main.rs"

[dependencies]
intention-client = { path = "../intention-client", version = "=0.0.0" }
intention-proto = { path = "../intention-proto", version = "=0.0.0" }
intention-transport = { path = "../intention-transport", version = "=0.0.0" }
lexopt = "0.3.2"
serde_json = "1.0.149"
tokio = { version = "1.53.1", features = ["macros", "rt", "signal", "sync", "time"] }

[dev-dependencies]
intention-test-support = { path = "../intention-test-support", version = "=0.0.0" }
tempfile = "3.24.0"
