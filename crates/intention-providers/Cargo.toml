[package]
name = "intention-providers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
async-openai = { version = "=0.42.1", default-features = false, features = ["rustls", "chat-completion", "byot"] }
futures-core = "0.3.31"
futures-util = "0.3.31"
intention-config = { path = "../intention-config", version = "=0.0.0" }
intention-proto = { path = "../intention-proto", version = "=0.0.0" }
openrouter-rs = "=0.18.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[dev-dependencies]
futures-executor = "0.3.31"
http = "1.5.0"
