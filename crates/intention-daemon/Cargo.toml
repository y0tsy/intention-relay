[package]
name = "intention-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
test-support = ["intention/test-support"]

[dependencies]
intention = { path = "../intention", version = "=0.0.0" }
intention-application = { path = "../intention-application", version = "=0.0.0" }
intention-domain = { path = "../intention-domain", version = "=0.0.0" }
intention-model = { path = "../intention-model", version = "=0.0.0" }
intention-protocol = { path = "../intention-protocol", version = "=0.0.0" }
intention-runtime = { path = "../intention-runtime", version = "=0.0.0" }
intention-transport = { path = "../intention-transport", version = "=0.0.0" }
intention-types = { path = "../intention-types", version = "=0.0.0" }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "test-util", "time"] }

[dev-dependencies]
futures-util = "0.3.31"
serde_json = "1.0.149"
intention = { path = "../intention", version = "=0.0.0", features = ["test-support"] }
intention-application = { path = "../intention-application", version = "=0.0.0" }
intention-config = { path = "../intention-config", version = "=0.0.0" }
intention-client = { path = "../intention-client", version = "=0.0.0" }
intention-domain = { path = "../intention-domain", version = "=0.0.0" }
intention-model = { path = "../intention-model", version = "=0.0.0" }
tempfile = "3.24.0"
