[package]
name = "intention-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
test-support = []

[dependencies]
futures-util = "0.3.31"
intention-config = { path = "../intention-config", version = "=0.0.0" }
intention-domain = { path = "../intention-domain", version = "=0.0.0" }
intention-engine = { path = "../intention-engine", version = "=0.0.0" }
intention-providers = { path = "../intention-providers", version = "=0.0.0" }
intention-storage = { path = "../intention-storage", version = "=0.0.0" }
intention-tools = { path = "../intention-tools", version = "=0.0.0" }
intention-transport = { path = "../intention-transport", version = "=0.0.0" }
intention-proto = { path = "../intention-proto", version = "=0.0.0" }
serde_json = "1.0.149"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "test-util", "time"] }

[dev-dependencies]
intention-client = { path = "../intention-client", version = "=0.0.0" }
intention-test-support = { path = "../intention-test-support", version = "=0.0.0" }
tempfile = "3.24.0"
