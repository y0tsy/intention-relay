[package]
name = "intention-test-support"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
futures-executor = "0.3.31"
futures-util = "0.3.31"
intention-client = { path = "../intention-client", version = "=0.0.0" }
intention-config = { path = "../intention-config", version = "=0.0.0" }
intention-daemon = { path = "../intention-daemon", version = "=0.0.0", features = ["test-support"] }
intention-proto = { path = "../intention-proto", version = "=0.0.0" }
intention-providers = { path = "../intention-providers", version = "=0.0.0" }
intention-transport = { path = "../intention-transport", version = "=0.0.0" }
serde_json = "1.0.149"
tempfile = "3.24.0"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt", "time"] }
