[package]
name = "intention-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
intention-client = { path = "../intention-client", version = "=0.0.0" }
intention-proto = { path = "../intention-proto", version = "=0.0.0" }
intention-transport = { path = "../intention-transport", version = "=0.0.0" }
lexopt = "0.3.2"
mimalloc = { version = "0.1", default-features = false }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "std", "layout-cache"] }
serde_json = "1.0.149"
tokio = { version = "1.53.1", features = ["macros", "rt", "signal", "sync", "time"] }
toml = "1.0.3"
tui-markdown = { version = "0.3.12", default-features = false }
tui-scrollview = "0.6.8"
unicode-width = "0.2"

# The terminal background probe reads its answer in raw mode beside a bounded
# readiness wait; mio is its event source. The terminal's own backend comes
# through ratatui's re-export, so this crate never names a crossterm version of
# its own.
[target.'cfg(unix)'.dependencies]
mio = "1.2"

[dev-dependencies]
intention-test-support = { path = "../intention-test-support", version = "=0.0.0" }
tempfile = "3.24.0"
