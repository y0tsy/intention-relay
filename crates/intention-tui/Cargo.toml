[package]
name = "intention-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
intention-client = { path = "../intention-client", version = "=0.0.0" }
intention-proto = { path = "../intention-proto", version = "=0.0.0" }
intention-transport = { path = "../intention-transport", version = "=0.0.0" }
lexopt = "0.3.2"
mimalloc = { version = "0.1", default-features = false }
revue = { version = "3.9.1", default-features = false, features = ["markdown"] }
serde_json = "1.0.149"
tokio = { version = "1.53.1", features = ["macros", "rt", "sync", "time"] }

[dev-dependencies]
intention-test-support = { path = "../intention-test-support", version = "=0.0.0" }
tempfile = "3.24.0"
