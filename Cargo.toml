[workspace]
members = [
  "crates/intention-proto",
  "crates/intention-engine",
  "crates/intention-storage",
  "crates/intention-config",
  "crates/intention-providers",
  "crates/intention-tools",
  "crates/intention-transport",
  "crates/intention-client",
  "crates/intention-daemon",
  "crates/intention-test-support",
  "crates/intention-cli",
]
default-members = [
  "crates/intention-proto",
  "crates/intention-config",
]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "deny"
# The two restriction lints below carry the DTO-first and working-directory
# source rules at the compiler level through `clippy.toml`, not by scanning text.
disallowed_types = "deny"
disallowed_methods = "deny"
# The nursery group is unstable and churns between releases, so it is not denied
# wholesale. The group sits at a lower priority than the individual lints below,
# which keep the five nursery lints chosen for readability, logic, and clarity.
nursery = { level = "allow", priority = -1 }
use_self = "deny"
redundant_clone = "deny"
option_if_let_else = "deny"
suspicious_operation_groupings = "deny"
unused_peekable = "deny"
must_use_candidate = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
return_self_not_must_use = "deny"
allow_attributes_without_reason = "deny"
as_underscore = "deny"
dbg_macro = "deny"
else_if_without_else = "deny"
exit = "deny"
mem_forget = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"

[profile.dev]
# Line tables instead of full debug info: smaller artifacts and faster
# linking in the CI pipeline while preserving backtraces for tests.
debug = 1

# Optimize every package in the graph for the dev profile so test binaries
# execute faster; the saved time compounds across the repeated test,
# coverage, and fixture passes in CI.
[profile.dev.package."*"]
opt-level = 2
