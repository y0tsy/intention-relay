[workspace]
members = [
  "crates/intention-types",
  "crates/intention-domain",
  "crates/intention-application",
  "crates/intention-runtime",
  "crates/intention-storage",
  "crates/intention-storage-sqlite",
  "crates/intention-config",
  "crates/intention-model",
  "crates/intention-provider-openrouter",
  "crates/intention-provider-generic-chat",
  "crates/intention-tools",
  "crates/intention-workspace",
  "crates/intention-hooks",
  "crates/intention-vfr",
  "crates/intention-headroom",
  "crates/intention-plans",
  "crates/intention-protocol",
  "crates/intention-transport",
  "crates/intention-client",
  "crates/intention",
  "crates/intention-daemon",
  "crates/intention-test-support",
  "crates/intention-tauri",
  "crates/intention-tui",
  "quality/harness",
]
default-members = [
  "crates/intention-types",
  "crates/intention-domain",
  "crates/intention-protocol",
  "crates/intention-config",
]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "deny"
nursery = "deny"
must_use_candidate = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
return_self_not_must_use = "deny"
use_self = "deny"
allow_attributes_without_reason = "deny"
as_underscore = "deny"
dbg_macro = "deny"
else_if_without_else = "deny"
exit = "deny"
expect_used = "deny"
mem_forget = "deny"
panic = "deny"
print_stdout = "deny"
print_stderr = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"

[profile.dev]
# Line tables instead of full debug info: smaller artifacts and faster
# linking in the CI pipeline while preserving backtraces for tests.
debug = 1

# Optimize every package in the graph for the dev profile at opt-level 1:
# the middle ground between full optimization (opt-level 2) and no
# optimization. opt-level 2 made every dependency and workspace crate
# compile with full codegen in every CI phase (test, coverage, lint,
# deps); level 1 cuts compile time materially while keeping test binaries
# fast enough that the repeated test, coverage, and fixture passes in CI do
# not regress.
[profile.dev.package."*"]
opt-level = 1
